<html lang="en">
<head>

<title>PSYCHOPATHIC ARCADE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}
  #arcade{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:#000}
  #arc-load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#ffd028;font:800 15px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:24px;background:#000}
  #arc-load .bar{width:min(260px,70vw);height:6px;border-radius:3px;background:#222;overflow:hidden}
  #arc-load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39ff6a,#ff2fa0);transition:width .2s}
  #arc-load small{color:#889;font-weight:600;letter-spacing:.04em;text-transform:none}
</style>
</head>
<body>
<div id="arc-load"><div>Loading the Psychopathic Arcade&hellip;</div><div class="bar"><i id="arc-pct"></i></div><small id="arc-msg"></small></div>
<iframe id="arcade" title="Psychopathic Arcade" allow="fullscreen; autoplay; gamepad" allowfullscreen hidden></iframe>
<div id="lunatics-gate" style="position:fixed;inset:0;z-index:2147483647;background:#0a0a0d;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;">

  <a id="lg-link" href="https://jcwlunacy.net/#lunatics" style="display:none;margin-top:18px;background:#ffd028;color:#000;font-weight:800;text-decoration:none;padding:12px 22px;border-radius:10px;">Get Lunatics Access</a>
</div>
<script>
/* ============================================================
   PSYCHOPATHIC ARCADE on jcwlunacy.net
   The games themselves live in the PsychopathicArcade GitHub repo
   (kirkcreason-dev/PsychopathicArcade, public/game.html). This page pulls
   the newest copy from that repo every time, so anything pushed there
   shows up here on its own. It runs the arcade on jcwlunacy.net's own
   origin (blob iframe), so players keep their saved scores/badges.
   This page keeps the site-only parts: the Lunatics Only gate, the
   locker wins (lockers/<uid>/arcade) and the play counter (stats/arcade).
   ============================================================ */
(function(){
  var CFG={apiKey:"AIzaSyCDCfMShCyyFZSC3qp1t75Rx_0fOfH3L_U",authDomain:"jcw-lunacy.firebaseapp.com",databaseURL:"https://jcw-lunacy-default-rtdb.firebaseio.com",projectId:"jcw-lunacy",storageBucket:"jcw-lunacy.firebasestorage.app",messagingSenderId:"743418158514",appId:"1:743418158514:web:d167d515509974fbf5d8ab"};
  var SOURCES=[
    'https://raw.githubusercontent.com/kirkcreason-dev/PsychopathicArcade/main/public/game.html',
    'https://cdn.jsdelivr.net/gh/kirkcreason-dev/PsychopathicArcade@main/public/game.html'
  ];
  var frame=document.getElementById('arcade'),load=document.getElementById('arc-load'),
      pct=document.getElementById('arc-pct'),msg=document.getElementById('arc-msg');

  /* ---------- firebase (shared by the gate, locker wins and play counter) ---------- */
  var fbWait=[],fbState=0; /* 0 idle, 1 loading, 2 ready, 3 failed */
  function ld(src,ok,bad){var x=document.createElement('script');x.src=src;x.onload=ok;x.onerror=bad;document.head.appendChild(x);}
  window.__arcFirebase=function(cb){
    if(fbState===2){cb(true);return;} if(fbState===3){cb(false);return;}
    fbWait.push(cb); if(fbState===1)return; fbState=1;
    function fin(ok){fbState=ok?2:3;var w=fbWait;fbWait=[];w.forEach(function(f){try{f(ok);}catch(e){}});}
    var v='https://www.gstatic.com/firebasejs/9.23.0/';
    ld(v+'firebase-app-compat.js',function(){
      ld(v+'firebase-auth-compat.js',function(){
        ld(v+'firebase-database-compat.js',function(){
          try{ if(!firebase.apps.length)firebase.initializeApp(CFG); fin(true); }catch(e){ fin(false); }
        },function(){fin(false);});
      },function(){fin(false);});
    },function(){fin(false);});
  };

  /* ---------- load the arcade from the repo ---------- */
  function fetchWithProgress(url){
    return fetch(url,{cache:'no-cache'}).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      var total=+r.headers.get('content-length')||7.5e6;
      if(!r.body||!r.body.getReader)return r.text();
      var rd=r.body.getReader(),chunks=[],got=0;
      function pump(){return rd.read().then(function(x){
        if(x.done){return new Blob(chunks).text();}
        chunks.push(x.value);got+=x.value.length;
        pct.style.width=Math.min(98,Math.round(got/total*100))+'%';
        return pump();
      });}
      return pump();
    }).then(function(t){
      if(t.length<100000||t.indexOf('PSYCHOPATHIC ARCADE')<0)throw new Error('not the arcade');
      return t;
    });
  }
  function start(i){
    if(i>=SOURCES.length){msg.textContent='Could not reach the arcade right now. Check your connection and refresh.';return;}
    fetchWithProgress(SOURCES[i]).then(function(html){
      pct.style.width='100%';
      frame.src=URL.createObjectURL(new Blob([html],{type:'text/html'}));
      frame.onload=function(){frame.hidden=false;load.style.display='none';try{frame.focus();}catch(e){}};
    }).catch(function(){start(i+1);});
  }
  start(0);

  /* ---------- messages from the arcade ---------- */
  window.addEventListener('message',function(e){
    var d=e.data;
    if(!d||d.type!=='jcw-arcade'||e.source!==frame.contentWindow)return;
    var g=String(d.g||'');
    var EXTRA={shooter:1,claw:1,clawrun:1};
    if(!EXTRA[d.ev]&&!/^[a-z0-9_]{1,24}$/.test(g))return;
    window.__arcFirebase(function(ok){
      if(!ok)return;
      try{
        var db=firebase.database(),bump=function(x){return (x||0)+1;};
        if(d.ev==='play'){
          db.ref('stats/arcade/'+g).transaction(bump);
          db.ref('stats/arcadeTotal').transaction(bump);
          return;
        }
        var u=firebase.auth().currentUser; if(!u)return;
        var ref=db.ref('lockers/'+u.uid+'/arcade');
        var num=function(x,cap){x=+x;return isFinite(x)&&x>0?Math.min(Math.floor(x),cap):0;};
        var mx=function(c,v){ref.child(c).transaction(function(x){return Math.max(+x||0,v);});};
        var add=function(c,v){if(v)ref.child(c).transaction(function(x){return (+x||0)+v;});};
        /* Carnival Crossfire: every finished round */
        if(d.ev==='shooter'){
          var shots=num(d.shots,10000),hits=num(d.hits,10000);
          add('shooter/runs',1);mx('shooter/best',num(d.score,1e7));mx('shooter/streak',num(d.streak,10000));
          add('shooter/bullseyes',num(d.bullseyes,500));
          if(shots>=20&&hits/shots>=0.9)ref.child('shooter/acc90').set(1);
          return;
        }
        /* Carnival Claw: the cabinet, one 5-bit mask per roster name, OR-merged */
        var clawMerge=function(m){
          if(!m||typeof m!=='object')return;var ok={};
          Object.keys(m).slice(0,300).forEach(function(id){var v=+m[id];if(/^[a-z0-9-]{1,48}$/.test(id)&&v>0&&v<32&&v===Math.floor(v))ok[id]=v;});
          if(!Object.keys(ok).length)return;
          ref.child('claw').transaction(function(cur){cur=cur&&typeof cur==='object'?cur:{};Object.keys(ok).forEach(function(id){cur[id]=((+cur[id]||0)|ok[id]);});return cur;});
        };
        if(d.ev==='claw'){clawMerge(d.masks);return;}
        if(d.ev==='clawrun'){
          clawMerge(d.masks);add('clawRuns',1);mx('clawBest',num(d.score,1e7));add('clawPerfects',num(d.perfects,5));
          if(num(d.wins,5)>=5)add('clawSweeps',1);
          return;
        }
        if(d.ev==='record'){ref.child('records').transaction(bump);return;}
        if(d.ev==='win'){
          ref.child('wins').transaction(bump);
          ref.child('games/'+g).transaction(bump);
          var v=+d.v; if(isFinite(v)&&v>0)ref.child('best/'+g).transaction(function(x){return Math.max(+x||0,v);});
        }
      }catch(err){}
    });
  });
})();
</script>
<script>

  var COMP={"oYrNiXZywhexmLqRQO7j1iyA1Bh1":1,"zRLXcejE4dWQRL0l07Bo19SO5j52":1,"GZ4FzgT740gxOtiFUtBaxshngbi2":1};
  var gate=document.getElementById('lunatics-gate'),t=document.getElementById('lg-title'),m=document.getElementById('lg-msg'),a=document.getElementById('lg-link');
  if(!gate)return;
  gate.style.display='flex';
  var done=false;
  function allow(){done=true;clearTimeout(fo);gate.style.display='none';}
  function block(title,msg){done=true;clearTimeout(fo);t.textContent=title;m.textContent=msg;a.style.display='inline-block';gate.style.display='flex';}
  /* never lock out a paying member on a network hiccup: fail open after 9s */
  var fo=setTimeout(function(){if(!done)allow();},9000);
  window.__arcFirebase(function(ok){
    if(!ok){if(!done)allow();return;}
    try{
      firebase.auth().onAuthStateChanged(function(u){
        if(done)return;
        if(!u){block('Lunatics Only','Log into your Juggalo Locker on jcwlunacy.net, then open the arcade.');return;}
        if(COMP[u.uid]){allow();return;}
        firebase.database().ref('premiumMembers/'+u.uid).once('value').then(function(snap){
          if(done)return;
          if(snap.val()===true)allow();
          else block('Lunatics Only','The Psychopathic Arcade is part of The Lunatics Only — join on jcwlunacy.net to play.');
        }).catch(function(){if(!done)allow();});
      });
    }catch(e){if(!done)allow();}
  });

</script>
